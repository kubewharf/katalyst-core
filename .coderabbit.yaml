language: "en-US"
early_access: false
tone_instructions: >-
  Prioritize correctness, concurrency safety, nil/error, tests. Conservative on
  data-integrity: only flag provable mismatches; cross-layer transforms are
  intentional. Write English, then Chinese. Don't translate code, paths, APIs,
  or markers.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: >-
    Summarize runtime behavior changes, affected components, operational or
    rollout risk, and any config or dependency updates. katalyst-core consumes
    katalyst-api via go.mod pin; note changes needing a new api field or bump
    first. Call out when changes affect agent, controller, scheduler, or
    release wiring. Write concise English text first, then equivalent
    Simplified Chinese. Do not translate code, paths, APIs, markers, protobuf
    names, or error strings.
  high_level_summary_in_walkthrough: false
  review_status: true
  review_details: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  slop_detection:
    enabled: true
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "DRAFT"
      - "DO NOT MERGE"
  # path_filters intentionally omitted: rely on CodeRabbit defaults, including *.pb.go, and keep repository sources broadly reviewable.
  path_instructions:
    - path: "**"
      instructions: |
        Treat go mod tidy and go vet findings as CI-covered. Formatting checks cover pkg/** and cmd/**. The paralleltest job excludes pkg/scheduler, pkg/controller/resource-recommend, pkg/util/resource-recommend, pkg/util/machine, and pkg/agent/qrm-plugins/sriov/policy; do not suppress formatting or t.Parallel findings outside the paths CI actually covers. Critical/Major only for concrete failures (data loss, panic, correctness bug, security vulnerability, privacy leak, credential exposure); style/speculation is Minor.
    - path: "{AGENTS.md,ai/**/*.md}"
      instructions: |
        Review agent guidance against the current Makefile, CI workflow, repository layout, and source-of-truth ownership. Flag commands or invariants that are stale, broader than enforcement, or inconsistent with more local guidance.
    - path: "go.mod"
      instructions: |
        Review dependency and module version changes for runtime behavior risk, katalyst-api compatibility, and transitive Kubernetes or controller-runtime impact.
        Flag version bumps that likely require code updates, config changes, or coordinated rollout notes.
    - path: ".github/workflows/**"
      instructions: |
        Review CI and release automation changes for correct branch triggers, pinned actions where appropriate, timeout and permission hygiene, and consistency with this repo's validation and release flow.
        Flag changes that weaken testing, vetting, or release safety.
    - path: "{cmd/**,pkg/agent/**,pkg/controller/**,pkg/metaserver/**,pkg/scheduler/**}"
      instructions: |
        Focus on runtime correctness: reconciliation idempotency, cache staleness, lock ordering, goroutine lifecycle, resource accounting, and nil/error paths.
        Flag behavior that can cause inconsistent node state, leaked background work, or partial updates after failures.
    - path: "pkg/config/**"
      instructions: |
        Check config defaulting and validation carefully.
        Flag new fields that are not wired through startup paths, feature gates, validation, or tests.
    - path: "**/*_test.go"
      instructions: |
        Prefer deterministic tests that cover failure paths, edge cases, and concurrency-sensitive behavior when relevant.
        Avoid asking for broad end-to-end tests when focused unit coverage is sufficient.
    - path: "docs/**/*.md"
      instructions: |
        Check for technical accuracy, outdated operational guidance, and mismatches between documented behavior and current runtime wiring.
    - path: "{cmd/**,pkg/agent/**,pkg/client/**,pkg/controller/**,pkg/custom-metric/**,pkg/metaserver/**,pkg/metrics/**,pkg/util/**,pkg/webhook/**}"
      instructions: |
        Flag unbounded identity tags such as pod UID or pod name. Evaluate namespace tags against the metric's scope and boundedness; do not flag namespace solely because it is present.
    - path: "pkg/scheduler/**"
      instructions: |
        pkg/scheduler is excluded from make test; require focused package tests for scheduling changes.
    - path: "{cmd/**,pkg/controller/resource-recommend/**,pkg/util/resource-recommend/**}"
      instructions: |
        These paths are not covered by make test. Require focused package tests for changed behavior or wiring, and do not treat the main local gate as complete without them.
    - path: "pkg/webhook/**"
      instructions: |
        Flag webhooks that mutate without validation or can reject valid pods.
    - path: "pkg/util/**"
      instructions: |
        Keep pkg/util dependency-light. Flag new imports of runtime implementation packages unless they follow an established narrowly scoped helper dependency and do not create a cycle.
    - path: "{Makefile,hack/**,build/**}"
      instructions: |
        Flag build/codegen changes that produce non-reproducible output.

knowledge_base:
  automatic_repository_linking: true

chat:
  auto_reply: true
