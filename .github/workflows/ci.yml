name: CI lifecycle wait-condition validation
run-name: Paired regression on 2bebfcdf1
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-lifecycle-validation
  cancel-in-progress: false
jobs:
  r1-fmt:
    name: R1 Format (${{ matrix.runner }})
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: 'false'
        ref: 2bebfcdf128df6a02c41d232c9e779447d19c332
    - name: Isolate cold caches
      shell: bash
      run: 'cache_root=$(mktemp -d "$RUNNER_TEMP/ci-pair-cache.XXXXXX")

        printf ''GOPATH=%s/gopath\nGOMODCACHE=%s/modules\nGOCACHE=%s/build\nGOLANGCI_LINT_CACHE=%s/lint\n'' "$cache_root" "$cache_root" "$cache_root" "$cache_root" >> "$GITHUB_ENV"

        printf ''%s/gopath/bin\n'' "$cache_root" >> "$GITHUB_PATH"

        '
    - uses: actions/setup-go@v5
      with:
        go-version: 1.18.10
        cache: false
    - name: Prepare build tools
      shell: bash
      run: "TIMEFORMAT=$'real %3R\\nuser %3U\\nsys %3S'\ntime bash -e -o pipefail <<'BUILD_TOOLS'\nif ! command -v make >/dev/null || ! command -v gcc >/dev/null; then\n  . /etc/os-release\n  if [[ \"$ID\" != ubuntu || ! \"$VERSION_CODENAME\" =~ ^(jammy|noble)$ ]]; then\n    printf 'Unsupported build-tool installation environment: %s %s\\n' \"$ID\" \"$VERSION_CODENAME\" >&2\n    exit 1\n  fi\n  apt_root=$(mktemp -d \"$RUNNER_TEMP/ci-apt.XXXXXX\")\n  trap 'sudo -n rm -rf -- \"$apt_root\"' EXIT\n  mkdir -p \"$apt_root/lists/partial\"\n  printf 'deb http://archive.ubuntu.com/ubuntu %s main universe\\ndeb http://archive.ubuntu.com/ubuntu %s-updates main universe\\ndeb http://archive.ubuntu.com/ubuntu %s-security main universe\\n' \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" > \"$apt_root/sources.list\"\n  apt_options=(-o \"Dir::Etc::sourcelist=$apt_root/sources.list\" -o \"Dir::Etc::sourceparts=-\" -o \"Dir::State::lists\" -o APT::Update::Error-Mode=any -o Acquire::Retries=0\
        \ -o Acquire::http::Timeout=30)\n  sudo -n apt-get \"${apt_options[@]}\" update\n  sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \"${apt_options[@]}\" install -y --no-install-recommends build-essential\nfi\ncommand -v make\ncommand -v gcc\nBUILD_TOOLS\n"
    - name: Record environment before work
      shell: bash
      run: "python3 - <<'PY'\nimport datetime, json, os, pathlib, platform, subprocess\n\ndef command(args):\n    import shutil\n    if shutil.which(args[0]) is None:\n        return {'exit': 127, 'output': 'executable not installed: ' + args[0]}\n    p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n    return {'exit': p.returncode, 'output': p.stdout.strip()}\n\ndef read(path):\n    p = pathlib.Path(path)\n    return p.read_text().strip() if p.is_file() else None\n\ncpuinfo = pathlib.Path('/proc/cpuinfo').read_text()\nmodels = sorted({line.split(':', 1)[1].strip() for line in cpuinfo.splitlines() if line.startswith('model name')})\nlimits = {p: read(p) for p in (\n    '/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/cpuset.cpus.effective',\n    '/sys/fs/cgroup/memory.max', '/sys/fs/cgroup/memory.current',\n    '/sys/fs/cgroup/cpu/cpu.cfs_quota_us', '/sys/fs/cgroup/cpu/cpu.cfs_period_us',\n    '/sys/fs/cgroup/cpuset/cpuset.cpus', '/sys/fs/cgroup/memory/memory.limit_in_bytes')}\n\
        result = {\n    'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),\n    'round': os.environ['PAIR_ROUND'], 'side': os.environ['PAIR_RUNNER'],\n    'runner_name': os.environ.get('RUNNER_NAME'), 'runner_arch': os.environ.get('RUNNER_ARCH'),\n    'kernel': platform.release(), 'cpu_models': models,\n    'logical_cpu': os.cpu_count(), 'affinity_cpu': sorted(os.sched_getaffinity(0)),\n    'loadavg': list(os.getloadavg()), 'meminfo': read('/proc/meminfo'),\n    'cgroup': read('/proc/self/cgroup'), 'limits': limits,\n    'cpu_pressure': read('/proc/pressure/cpu'), 'memory_pressure': read('/proc/pressure/memory'),\n    'git': command(['git', 'rev-parse', 'HEAD']), 'go': command(['go', 'version']),\n    'go_env': command(['go', 'env', 'CGO_ENABLED', 'GOPROXY', 'GOPATH', 'GOMODCACHE', 'GOCACHE']),\n    'make': command(['make', '--version']), 'gcc': command(['gcc', '--version']),\n}\nprint('CI_PROFILE ' + json.dumps(result, sort_keys=True))\nPY\n"
    - name: Check Go modules
      run: 'TIMEFORMAT=$''real %3R\nuser %3U\nsys %3S''

        time bash -e -o pipefail <<''CI_SCRIPT''

        go mod tidy && git add go.* &&

        git diff --cached --exit-code || (echo ''Please run "go mod tidy" to sync Go modules'' && exit 1);

        CI_SCRIPT

        '
      shell: bash
    - name: Verify gofumpt
      run: 'TIMEFORMAT=$''real %3R\nuser %3U\nsys %3S''

        time bash -e -o pipefail <<''CI_SCRIPT''

        echo "refer to https://github.com/mvdan/gofumpt for detailed info" &&

        GO111MODULE=on go install mvdan.cc/gofumpt@v0.4.0 &&

        make fmt-strict && git add pkg cmd &&

        git diff --cached --exit-code || (echo ''Please run "make fmt-strict" to verify fmt'' && exit 1);

        CI_SCRIPT

        '
      shell: bash
    - name: Record environment after work
      if: always() && !cancelled()
      shell: bash
      run: "python3 - <<'PY'\nimport datetime, json, os, pathlib, platform, subprocess\n\ndef command(args):\n    import shutil\n    if shutil.which(args[0]) is None:\n        return {'exit': 127, 'output': 'executable not installed: ' + args[0]}\n    p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n    return {'exit': p.returncode, 'output': p.stdout.strip()}\n\ndef read(path):\n    p = pathlib.Path(path)\n    return p.read_text().strip() if p.is_file() else None\n\ncpuinfo = pathlib.Path('/proc/cpuinfo').read_text()\nmodels = sorted({line.split(':', 1)[1].strip() for line in cpuinfo.splitlines() if line.startswith('model name')})\nlimits = {p: read(p) for p in (\n    '/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/cpuset.cpus.effective',\n    '/sys/fs/cgroup/memory.max', '/sys/fs/cgroup/memory.current',\n    '/sys/fs/cgroup/cpu/cpu.cfs_quota_us', '/sys/fs/cgroup/cpu/cpu.cfs_period_us',\n    '/sys/fs/cgroup/cpuset/cpuset.cpus', '/sys/fs/cgroup/memory/memory.limit_in_bytes')}\n\
        result = {\n    'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),\n    'round': os.environ['PAIR_ROUND'], 'side': os.environ['PAIR_RUNNER'],\n    'runner_name': os.environ.get('RUNNER_NAME'), 'runner_arch': os.environ.get('RUNNER_ARCH'),\n    'kernel': platform.release(), 'cpu_models': models,\n    'logical_cpu': os.cpu_count(), 'affinity_cpu': sorted(os.sched_getaffinity(0)),\n    'loadavg': list(os.getloadavg()), 'meminfo': read('/proc/meminfo'),\n    'cgroup': read('/proc/self/cgroup'), 'limits': limits,\n    'cpu_pressure': read('/proc/pressure/cpu'), 'memory_pressure': read('/proc/pressure/memory'),\n    'git': command(['git', 'rev-parse', 'HEAD']), 'go': command(['go', 'version']),\n    'go_env': command(['go', 'env', 'CGO_ENABLED', 'GOPROXY', 'GOPATH', 'GOMODCACHE', 'GOCACHE']),\n    'make': command(['make', '--version']), 'gcc': command(['gcc', '--version']),\n}\nprint('CI_PROFILE ' + json.dumps(result, sort_keys=True))\nPY\n"
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'kubewharf/katalyst-core' && github.ref == 'refs/heads/test/ci-lifecycle-validation'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
        - internal
        - hosted
    env:
      PAIR_ROUND: '1'
      PAIR_RUNNER: ${{ matrix.runner }}
