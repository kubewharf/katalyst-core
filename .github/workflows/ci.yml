        \ stderr=subprocess.STDOUT)\\n    return {\\'exit\\': p.returncode, \\'output\\': p.stdout.strip()}\\n\\n\\ndef read(path):\\n    p = pathlib.Path(path)\\n    try:\\n        return p.read_text().strip() if p.is_file() else None\\n    except OSError:\\n        return None\\n\\n\\ndef digest(path):\\n    p = pathlib.Path(path)\\n    return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None\\n\\n\\ndef cgroups():\\n    result = []\\n    for entry in pathlib.Path(\\'/proc/self/cgroup\\').read_text().splitlines():\\n        hierarchy, controllers, member = entry.split(\\':\\', 2)\\n        for mount in pathlib.Path(\\'/proc/self/mountinfo\\').read_text().splitlines():\\n            left, right = mount.split(\\' - \\', 1)\\n            fields, fs = left.split(), right.split()\\n            if fs[0] not in (\\'cgroup\\', \\'cgroup2\\'):\\n                continue\\n            if hierarchy == \\'0\\' and fs[0] != \\'cgroup2\\':\\n                continue\\n            if\
        \ hierarchy != \\'0\\' and (fs[0] != \\'cgroup\\' or not set(controllers.split(\\',\\')).intersection(fs[2].split(\\',\\'))):\\n                continue\\n            mount_root, mount_dir = fields[3], fields[4]\\n            base = pathlib.Path(mount_dir)\\n            if member == mount_root:\\n                leaf = base\\n            elif member.startswith(mount_root.rstrip(\\'/\\') + \\'/\\'):\\n                leaf = base / member[len(mount_root):].lstrip(\\'/\\')\\n            else:\\n                leaf = base / member.lstrip(\\'/\\')\\n            candidates = [leaf]\\n            if leaf.is_dir():\\n                candidates.extend(p for p in leaf.parents if p == base or base in p.parents)\\n            for path in candidates:\\n                names = (\\'cpu.max\\', \\'cpuset.cpus.effective\\', \\'memory.max\\', \\'memory.current\\', \\'cpu.stat\\', \\'memory.peak\\') if fs[0] == \\'cgroup2\\' else (\\'cpu.cfs_quota_us\\', \\'cpu.cfs_period_us\\', \\'cpu.stat\\', \\\
        'cpuset.cpus\\', \\'memory.limit_in_bytes\\', \\'memory.usage_in_bytes\\', \\'memory.max_usage_in_bytes\\')\\n                result.append({\\'hierarchy\\': hierarchy, \\'controllers\\': controllers,\\n                               \\'path\\': str(path), \\'exists\\': path.is_dir(),\\n                               \\'values\\': {name: read(path / name) for name in names}})\\n    return result\\n\\n\\ndef profile(worktree, env):\\n    cpuinfo = pathlib.Path(\\'/proc/cpuinfo\\').read_text()\\n    disk = shutil.disk_usage(worktree)\\n    value = {\\n        \\'utc\\': time.strftime(\\'%Y-%m-%dT%H:%M:%SZ\\', time.gmtime()),\\n        \\'runner_name\\': os.environ.get(\\'RUNNER_NAME\\'),\\n        \\'runner_arch\\': os.environ.get(\\'RUNNER_ARCH\\'),\\n        \\'runner_os\\': os.environ.get(\\'RUNNER_OS\\'),\\n        \\'image_os\\': os.environ.get(\\'ImageOS\\'),\\n        \\'image_version\\': os.environ.get(\\'ImageVersion\\'),\\n        \\'kernel\\': platform.release(), \\'machine\\\
        ': platform.machine(),\\n        \\'cpu_models\\': sorted({l.split(\\':\\', 1)[1].strip() for l in cpuinfo.splitlines() if l.startswith(\\'model name\\')}),\\n        \\'logical_cpu\\': os.cpu_count(), \\'affinity_cpu\\': sorted(os.sched_getaffinity(0)),\\n        \\'loadavg\\': list(os.getloadavg()), \\'meminfo\\': read(\\'/proc/meminfo\\'),\\n        \\'cgroup\\': read(\\'/proc/self/cgroup\\'), \\'cgroup_limits\\': cgroups(),\\n        \\'cpu_pressure\\': read(\\'/proc/pressure/cpu\\'),\\n        \\'memory_pressure\\': read(\\'/proc/pressure/memory\\'),\\n        \\'disk_total\\': disk.total, \\'disk_free\\': disk.free,\\n        \\'go\\': command([\\'go\\', \\'version\\'], env=env),\\n        \\'gcc\\': command([\\'gcc\\', \\'--version\\'], env=env),\\n        \\'make\\': command([\\'make\\', \\'--version\\'], env=env),\\n        \\'go_env\\': command([\\'go\\', \\'env\\', \\'CGO_ENABLED\\', \\'GOPROXY\\', \\'GOPATH\\', \\'GOMODCACHE\\', \\'GOCACHE\\', \\'GOVERSION\\'], env=env),\\\
        n        \\'go_contract\\': command([\\'go\\', \\'env\\', \\'CGO_ENABLED\\', \\'GOPROXY\\', \\'GOVERSION\\', \\'GOOS\\', \\'GOARCH\\'], env=env),\\n        \\'git\\': command([\\'git\\', \\'rev-parse\\', \\'HEAD\\'], cwd=worktree),\\n        \\'source_sha256\\': {name: digest(worktree / name) for name in (\\'go.mod\\', \\'go.sum\\', \\'Makefile\\')},\\n    }\\n    return value\\n\\n\\ndef fingerprint(value):\\n    names = (\\'runner_name\\', \\'runner_arch\\', \\'runner_os\\', \\'image_os\\', \\'image_version\\',\\n             \\'kernel\\', \\'machine\\', \\'cpu_models\\', \\'logical_cpu\\', \\'affinity_cpu\\',\\n             \\'go\\', \\'go_contract\\', \\'gcc\\', \\'make\\', \\'source_sha256\\')\\n    result = {k: value[k] for k in names}\\n    limits = (\\'cpu.max\\', \\'cpuset.cpus.effective\\', \\'memory.max\\', \\'cpu.cfs_quota_us\\',\\n              \\'cpu.cfs_period_us\\', \\'cpuset.cpus\\', \\'memory.limit_in_bytes\\')\\n    result[\\'cgroup_limits\\'] = [dict(path=p[\\\
        'path\\'], exists=p[\\'exists\\'],\\n        values={k: v for k, v in p[\\'values\\'].items() if k in limits}) for p in value[\\'cgroup_limits\\']]\\n    return result\\n\\n\\ndef oracle(folder, variant):\\n    log_path = folder / \\'unit.log\\'\\n    text = log_path.read_text(errors=\\'replace\\') if log_path.is_file() else \\'\\'\\n    errors = []\\n    report = folder / \\'report.xml\\'\\n    result = {\\'race_count\\': text.count(\\'WARNING: DATA RACE\\'),\\n              \\'build_failed_count\\': len(re.findall(r\\'\\\\[build failed\\\\]\\', text)),\\n              \\'panic_count\\': len(re.findall(r\\'^panic:\\', text, re.M)),\\n              \\'package_ok_count\\': len(re.findall(r\\'^ok\\\\s+\\', text, re.M)),\\n              \\'package_fail_lines\\': re.findall(r\\'^FAIL\\\\s+.*$\\', text, re.M),\\n              \\'dynamicpolicy_result\\': re.findall(r\\'^(?:ok\\\\s+|FAIL\\\\s+)\\' + re.escape(DP) + r\\'\\\\s+.*$\\', text, re.M),\\n              \\'coverage_bytes\\': (folder\
        \ / \\'coverage.txt\\').stat().st_size if (folder / \\'coverage.txt\\').is_file() else 0}\\n    if report.is_file():\\n        try:\\n            tree = ET.parse(report)\\n            cases = list(tree.iter(\\'testcase\\'))\\n            skipped = [c for c in cases if c.find(\\'skipped\\') is not None]\\n            executed = [c for c in cases if c.find(\\'skipped\\') is None]\\n            failures = [c for c in executed if c.find(\\'failure\\') is not None or c.find(\\'error\\') is not None]\\n            result.update(executed=len(executed), skipped=len(skipped), failed=len(failures),\\n                          failures=[{\\'classname\\': c.get(\\'classname\\'), \\'name\\': c.get(\\'name\\')} for c in failures])\\n            identity = [{\\'classname\\': c.get(\\'classname\\'), \\'name\\': c.get(\\'name\\'), \\'time\\': c.get(\\'time\\'),\\n                         \\'skipped\\': c.find(\\'skipped\\') is not None} for c in cases]\\n            (folder / \\'testcases.json\\\
        ').write_text(json.dumps(identity, indent=2))\\n            result[\\'dynamicpolicy_testcases\\'] = [c for c in identity if c[\\'classname\\'] == DP]\\n            if len(executed) != EXPECTED[variant]:\\n                errors.append(\\'testcase count differs from frozen revision expectation\\')\\n            if skipped or failures:\\n                errors.append(\\'testcase failure/error or skipped\\')\\n        except ET.ParseError as exc:\\n            errors.append(\\'report parse error: \\' + str(exc))\\n    else:\\n        errors.append(\\'report missing\\')\\n    if not result[\\'coverage_bytes\\']:\\n        errors.append(\\'coverage missing or empty\\')\\n    if result[\\'race_count\\'] or result[\\'build_failed_count\\'] or result[\\'panic_count\\'] or result[\\'package_fail_lines\\']:\\n        errors.append(\\'race/build/panic/package failure\\')\\n    result[\\'errors\\'] = errors\\n    result[\\'pass\\'] = not errors\\n    return result\\n\\n\\ndef sample(variant):\\\
        n    round_no = os.environ[\\'PAIR_ROUND\\']\\n    side = os.environ[\\'PAIR_RUNNER\\']\\n    folder = OUT / (variant + \\'-r\\' + round_no + \\'-\\' + side)\\n    folder.mkdir(parents=True, exist_ok=False)\\n    runtime = pathlib.Path(os.environ[\\'RUNNER_TEMP\\']) / (\\'ci-depinject-ab-\\' + os.environ[\\'GITHUB_RUN_ID\\'] + \\'-\\' + round_no + \\'-\\' + variant)\\n    runtime.mkdir(parents=True, exist_ok=False)\\n    worktree = runtime / \\'source\\'\\n    cache = runtime / \\'cache\\'\\n    env = dict(os.environ)\\n    env.update(GOPATH=str(cache / \\'gopath\\'), GOMODCACHE=str(cache / \\'modules\\'),\\n               GOCACHE=str(cache / \\'build\\'), GOTMPDIR=str(cache / \\'tmp\\'), CGO_ENABLED=\\'1\\')\\n    for path in (cache / \\'gopath\\', cache / \\'modules\\', cache / \\'build\\', cache / \\'tmp\\'):\\n        path.mkdir(parents=True)\\n    env[\\'PATH\\'] = str(cache / \\'gopath\\' / \\'bin\\') + \\':\\' + env[\\'PATH\\']\\n    result = {\\'variant\\': variant, \\'revision\\\
        ': REVISIONS[variant], \\'round\\': round_no,\\n              \\'runner\\': side, \\'order\\': os.environ[\\'PAIR_ORDER\\'], \\'status\\': \\'INFRA_INVALID\\',\\n              \\'install_exit\\': None, \\'make_exit\\': None, \\'junit_exit\\': None}\\n    try:\\n        subprocess.run([\\'git\\', \\'worktree\\', \\'add\\', \\'--detach\\', str(worktree), REVISIONS[variant]], cwd=ROOT, check=True)\\n        before = profile(worktree, env)\\n        if not pathlib.Path(\\'/usr/bin/time\\').is_file():\\n            raise RuntimeError(\\'GNU time missing before timed workload\\')\\n        (folder / \\'before.json\\').write_text(json.dumps(before, indent=2))\\n        result[\\'fingerprint\\'] = fingerprint(before)\\n        result[\\'fingerprint_sha256\\'] = hashlib.sha256(json.dumps(result[\\'fingerprint\\'], sort_keys=True).encode()).hexdigest()\\n        if before[\\'go\\'][\\'output\\'] != \\'go version go1.18.10 linux/amd64\\':\\n            raise RuntimeError(\\'unexpected Go runtime:\
        \ \\' + before[\\'go\\'][\\'output\\'])\\n        start = time.monotonic()\\n        with (folder / \\'install.log\\').open(\\'w\\') as log:\\n            install = subprocess.run([\\'go\\', \\'install\\', \\'github.com/jstemmer/go-junit-report/v2@v2.1.0\\'],\\n                cwd=worktree, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=3600)\\n        result[\\'install_exit\\'] = install.returncode\\n        if install.returncode != 0:\\n            result[\\'unit_wall_s\\'] = time.monotonic() - start\\n            raise RuntimeError(\\'go-junit-report installation failed\\')\\n        make_start = time.monotonic()\\n        shell = r\\'\\'\\'set +e\\nset -o pipefail\\n/usr/bin/time -f \\'AB_TIME user_s=%U sys_s=%S max_rss_kb=%M elapsed_s=%e exit=%x\\' -o \"$AB_SAMPLE/make-time.txt\" sudo -n env \"PATH=$PATH\" \"GOPATH=$GOPATH\" \"GOMODCACHE=$GOMODCACHE\" \"GOCACHE=$GOCACHE\" \"GOTMPDIR=$GOTMPDIR\" \"CGO_ENABLED=$CGO_ENABLED\" make test 2>&1 | go-junit-report -parser gotest\
        \ -set-exit-code -iocopy -out \"$AB_SAMPLE/report.xml\"\\nrcs=(\"${PIPESTATUS[@]}\")\\nprintf \\'%s %s\\\\n\\' \"${rcs[0]}\" \"${rcs[1]}\" > \"$AB_SAMPLE/pipeline-exit.txt\"\\nexit 0\\n\\'\\'\\'\\n        env[\\'AB_SAMPLE\\'] = str(folder)\\n        with (folder / \\'unit.log\\').open(\\'w\\') as log:\\n            child = subprocess.Popen([\\'bash\\', \\'-c\\', shell], cwd=worktree, env=env,\\n                                     stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\\n            try:\\n                child.wait(timeout=max(1, 3600 - (time.monotonic() - start)))\\n            except subprocess.TimeoutExpired:\\n                # Terminate the entire test pipeline before collecting/cleaning its worktree.\\n                try:\\n                    os.killpg(child.pid, signal.SIGTERM)\\n                    child.wait(timeout=10)\\n                except (ProcessLookupError, subprocess.TimeoutExpired):\\n                    try:\\n                       \
        \ os.killpg(child.pid, signal.SIGKILL)\\n                    except ProcessLookupError:\\n                        pass\\n                    child.wait()\\n                result[\\'unit_wall_s\\'] = time.monotonic() - start\\n                raise RuntimeError(\\'sample protection timeout; not a completed performance sample\\')\\n        result[\\'make_wall_s\\'] = time.monotonic() - make_start\\n        result[\\'unit_wall_s\\'] = time.monotonic() - start\\n        make_exit, junit_exit = map(int, (folder / \\'pipeline-exit.txt\\').read_text().split())\\n        result.update(make_exit=make_exit, junit_exit=junit_exit,\\n                      gnu_time=read(folder / \\'make-time.txt\\'))\\n        coverage = worktree / \\'coverage.txt\\'\\n        if coverage.is_file():\\n            shutil.copy2(coverage, folder / \\'coverage.txt\\')\\n            result[\\'coverage_sha256\\'] = digest(folder / \\'coverage.txt\\')\\n        result[\\'oracle\\'] = oracle(folder, variant)\\n    \
        \    result[\\'status\\'] = \\'PASS\\' if result[\\'oracle\\'][\\'pass\\'] and make_exit == 0 and junit_exit == 0 else \\'CORRECTNESS_FAILED\\'\\n        if result[\\'oracle\\'].get(\\'executed\\', 0) == 0 or not result[\\'oracle\\'][\\'coverage_bytes\\']:\\n            result[\\'status\\'] = \\'INFRA_INVALID\\'\\n        after = profile(worktree, env)\\n        (folder / \\'after.json\\').write_text(json.dumps(after, indent=2))\\n        result[\\'sample_static_drift\\'] = fingerprint(after) != fingerprint(before)\\n        if result[\\'sample_static_drift\\']:\\n            result[\\'status\\'] = \\'DRIFT\\'\\n    except Exception as exc:\\n        result[\\'infrastructure_error\\'] = str(exc)\\n        print(\\'AB_INFRA_ERROR\\', variant, str(exc), flush=True)\\n    finally:\\n        (folder / \\'sample.json\\').write_text(json.dumps(result, indent=2))\\n        # Preserve only structured summary in the live job log; full logs are artifacts.\\n        compact = {k: v for k, v\
        \ in result.items() if k not in (\\'fingerprint\\', \\'oracle\\')}\\n        compact[\\'oracle\\'] = {k: v for k, v in result.get(\\'oracle\\', {}).items() if k != \\'dynamicpolicy_testcases\\'}\\n        print(\\'AB_SAMPLE \\' + json.dumps(compact, sort_keys=True), flush=True)\\n        if worktree.is_dir():\\n            subprocess.run([\\'sudo\\', \\'-n\\', \\'chown\\', \\'-R\\', str(os.getuid()) + \\':\\' + str(os.getgid()), str(runtime)], check=False)\\n            removed = subprocess.run([\\'git\\', \\'worktree\\', \\'remove\\', \\'--force\\', str(worktree)], cwd=ROOT).returncode\\n            if removed == 0:\\n                # Go\\'s downloaded module trees are read-only even after chown.\\n                subprocess.run([\\'sudo\\', \\'-n\\', \\'rm\\', \\'-rf\\', \\'--\\', str(runtime)], check=True)\\n    return 0 if result[\\'status\\'] == \\'PASS\\' else 1\\n\\n\\ndef summarize():\\n    samples = [json.loads(p.read_text()) for p in sorted(OUT.glob(\\'*/sample.json\\\
        '))]\\n    drift = len(samples) != 2 or samples[0].get(\\'fingerprint\\') != samples[1].get(\\'fingerprint\\')\\n    pair = {\\'round\\': os.environ[\\'PAIR_ROUND\\'], \\'runner\\': os.environ[\\'PAIR_RUNNER\\'],\\n            \\'order\\': os.environ[\\'PAIR_ORDER\\'], \\'static_fingerprint_match\\': not drift,\\n            \\'samples\\': samples, \\'normal_performance_pair\\': not drift and all(s[\\'status\\'] == \\'PASS\\' for s in samples)}\\n    by_variant = {s[\\'variant\\']: s for s in samples}\\n    if all(v in by_variant and \\'unit_wall_s\\' in by_variant[v] for v in (\\'A\\', \\'B\\')):\\n        a, b = by_variant[\\'A\\'][\\'unit_wall_s\\'], by_variant[\\'B\\'][\\'unit_wall_s\\']\\n        pair[\\'descriptive_unit_ratio_B_over_A\\'] = b / a\\n        pair[\\'descriptive_unit_delta_s\\'] = b - a\\n    if all(v in by_variant and \\'oracle\\' in by_variant[v] for v in (\\'A\\', \\'B\\')):\\n        def top_names(s):\\n            return {c[\\'name\\'] for c in s[\\'oracle\\\
        '][\\'dynamicpolicy_testcases\\'] if \\'/\\' not in c[\\'name\\']}\\n        pair[\\'dynamicpolicy_missing_top_tests_in_B\\'] = sorted(top_names(by_variant[\\'A\\']) - top_names(by_variant[\\'B\\']))\\n    (OUT / \\'pair.json\\').write_text(json.dumps(pair, indent=2))\\n    summary = [\\'## Cold-cache A/B pair\\', \\'\\', \\'| Variant | status | unit wall s | make wall s | executed | failed | skipped | race |\\', \\'|---|---|---:|---:|---:|---:|---:|---:|\\']\\n    for s in samples:\\n        o = s.get(\\'oracle\\', {})\\n        summary.append(\\'| {variant} | {status} | {unit_wall_s} | {make_wall_s} | {executed} | {failed} | {skipped} | {race} |\\'.format(\\n            variant=s[\\'variant\\'], status=s[\\'status\\'], unit_wall_s=s.get(\\'unit_wall_s\\'), make_wall_s=s.get(\\'make_wall_s\\'),\\n            executed=o.get(\\'executed\\'), failed=o.get(\\'failed\\'), skipped=o.get(\\'skipped\\'), race=o.get(\\'race_count\\')))\\n    summary.extend([\\'\\', \\'All failures retained.\
        \ Normal-performance eligibility: \\' + str(pair[\\'normal_performance_pair\\']), \\'\\', \\'```json\\', json.dumps(pair, indent=2), \\'```\\', \\'\\'])\\n    with open(os.environ[\\'GITHUB_STEP_SUMMARY\\'], \\'a\\') as f:\\n        f.write(\\'\\\\n\\'.join(summary))\\n    print(\\'AB_PAIR \\' + json.dumps({k: v for k, v in pair.items() if k != \\'samples\\'}, sort_keys=True))\\n    return 0\\n\\n\\nif __name__ == \\'__main__\\':\\n    sys.exit(summarize() if sys.argv[1] == \\'summarize\\' else sample(sys.argv[1]))\\n')\n(p / 'experiment-contract.md').write_text('# CPU dynamicpolicy \u4E09\u8F6E A/B \u5B9E\u9A8C\u5408\u540C\\n\\n## \u51BB\u7ED3\u8303\u56F4\\n\\n- A\uFF1A\u539F mockey \u57FA\u7EBF `2bebfcdf128df6a02c41d232c9e779447d19c332`\u3002\\n- B\uFF1A\u8DEF\u7EBF2\u4F9D\u8D56\u6CE8\u5165\u4FEE\u590D `14c0f514628179b316b10b7bc3dd1d82fbdd6dde`\u3002\\n- \u5DEE\u91CF\uFF1Adynamicpolicy \u9876\u5C42\u56DB\u6587\u4EF6\u6539\u9020\uFF1B\u4E0D\u91C7\u7528\u5220\u9664 t.Parallel \u7684\
        \u7248\u672C\uFF0C\u4E0D\u6539\u6D4B\u8BD5/\u751F\u4EA7\u6E90\u7801\u3002\\n- \u5355\u8F6E\u9A8C\u8BC1 #9768 \u53EA\u4F5C\u4E3A\u5DF2\u901A\u8FC7\u7684\u6B63\u786E\u6027\u65C1\u8BC1\uFF0C\u4E0D\u6DF7\u5165\u672C\u6B21\u914D\u5BF9\u7EDF\u8BA1\u3002\\n- \u5404 runner 3 \u4E2A\u72EC\u7ACB\u914D\u5BF9 job\uFF1B\u987A\u5E8F R1=A/B\uFF0CR2=B/A\uFF0CR3=A/B\u3002\u6BCF\u7EC4\u4E24\u7248\u672C\u5728\u540C\u4E00\u4E2A job/\u540C\u4E00\u53F0\u673A\u5668\u8FDE\u7EED\u8FD0\u884C\u3002\u5404\u8F6E\u901A\u8FC7 needs \u4E32\u8054\uFF0Cinternal \u4E0E hosted \u540C\u65F6\u8FD0\u884C\u4F46\u4E0D\u5171\u4EAB\u673A\u5668\uFF0C\u4E0D\u5728\u540C\u4E00 runner \u5E76\u53D1\u591A\u8F6E\u3002\\n- \u4E3B\u4ED3\u4EC5\u5EFA\u624B\u52A8\u89E6\u53D1\u4E34\u65F6\u5206\u652F `test/ci-depinject-ab`\uFF0C\u4E0D\u6539\u9ED8\u8BA4\u5206\u652F\u6216\u5171\u4EAB runner \u914D\u7F6E\uFF1B\u9A8C\u540E\u5220\u9664\u5E76 ls-remote \u6838\u9A8C\u3002\u672C\u5730\u4E34\u65F6 worktree \u4E00\u5E76\u6E05\u7406\uFF0Cfork B \u4FDD\
        \u7559\u4E0D\u53D8\u3002\\n\\n## \u6D4B\u91CF\u5408\u540C\\n\\n- Linux amd64\uFF1BGo 1.18.10\uFF1BCGO_ENABLED=1\uFF1Binternal=`vke-self-hosted`\uFF0Chosted=`ubuntu-24.04`\u3002\\n- \u539F Makefile \u7684 `make test` \u547D\u4EE4\u4E0D\u53D8\uFF1A`-v -race -covermode=atomic -coverpkg=./... -parallel=16 -p=16 -timeout=30m -gcflags=all=\"-l\"`\uFF0C\u539F\u5305\u8FC7\u6EE4\u4E0D\u53D8\u3002\\n- \u6BCF\u4E2A sample \u5728\u72EC\u7ACB worktree/\u72EC\u7ACB GOPATH\u3001GOMODCACHE\u3001GOCACHE\u3001GOTMPDIR \u5185\u8FD0\u884C\uFF1B\u65E0\u9884\u70ED\u3001\u65E0\u590D\u7528 build/module/test \u7F13\u5B58\u3002\u6BCF\u4E2A sample \u6536\u8BC1\u540E\u6E05\u7406\u81EA\u5DF1\u521B\u5EFA\u7684\u7F13\u5B58\uFF0C\u907F\u514D\u4E0B\u4E00\u6837\u672C\u78C1\u76D8\u4E0D\u8DB3\u3002OS page cache\u4E0D\u4E3B\u52A8\u6E05\u7406\uFF0C\u8BB0\u5F55\u987A\u5E8F\uFF1B\u8DE8\u7248\u672C\u5148\u540E\u6548\u5E94\u7531AB/BA\u4EA4\u66FF\u89C2\u6D4B\uFF0C\u4E0D\u80FD\u5BA3\u79F0\u5DF2\u5F7B\u5E95\u6D88\u9664\u3002\
        \\n- \u4E3B\u6307\u6807\uFF1A`unit_wall_s`\uFF0C\u4ECE\u5B89\u88C5 go-junit-report/v2@v2.1.0 \u5F00\u59CB\u5230 make test/JUnit \u7BA1\u9053\u9000\u51FA\uFF0C\u5305\u542B\u51B7\u4E0B\u8F7D/\u7F16\u8BD1\u4E0Erace\u8986\u76D6\u7387\u6D4B\u8BD5\uFF0C\u6392\u9664 checkout/setup-go/build-tools \u5B89\u88C5\u3001\u73AF\u5883\u91C7\u96C6\u3001oracle\u4E0E\u6536\u8BC1\u3002\\n- \u6B21\u6307\u6807\uFF1A`make_wall_s`\uFF08make test\u672C\u8EAB\u7684\u51B7\u7F16\u8BD1\u3001\u63D2\u6869\u53CA\u6D4B\u8BD5\uFF09\uFF1BGNU time user/sys/maxRSS\uFF1Bdynamicpolicy\u5305\u7684go test\u62A5\u544A\u8017\u65F6\uFF08\u72EC\u7ACB\u8FB9\u754C\uFF0C\u4E0D\u5916\u63A8\u5230\u5168\u4ED3\uFF09\u3002\\n- \u6BCF\u4E2Asample\u5747\u4FDD\u5B58\u8BA1\u65F6\u3001\u5B8C\u6574log\u3001report.xml\u3001coverage.txt\u3001\u8986\u76D6\u7387sha256\u3001go.mod/go.sum/Makefile\u6458\u8981\u3001\u5B9E\u9645\u9000\u51FA\u7801\u4EE5\u53CAbefore/after environment JSON\u3002\u73AF\u5883\u5305\u62ECrunner/image\u3001kernel\u3001\
        CPU model\u3001logical/affinity CPUs\u3001cgroup leaf\u53CA\u7956\u5148\u9650\u989D\u3001\u5185\u5B58\u3001CPU pressure/loadavg\u3001\u78C1\u76D8\u7A7A\u95F4\u3001Go/GCC/tool\u94FE\u3002\\n- \u6BCF\u7EC4A/B\u6838\u5BF9static fingerprint\uFF1BCPU/cgroup\u9650\u989D\u3001\u4F9D\u8D56\u3001\u5DE5\u5177\u94FE\u6216kernel\u7B49\u4E0D\u540C\u5219\u6807DRIFT\uFF0C\u4FDD\u7559\u6837\u672C\u4F46\u4E0D\u7EB3\u5165\u6027\u80FD\u7ED3\u8BBA\u3002load/pressure\u52A8\u6001\u91CF\u53EA\u4F5C\u6DF7\u6742\u8BC1\u636E\uFF0C\u4E0D\u4E8B\u540E\u5220\u201C\u6162\u201D\u6837\u672C\u3002\\n\\n## Oracle\u53CA\u505C\u6B62\u89C4\u5219\\n\\n- A\u5E94\u6267\u884C4181 testcase\uFF1BB\u5E94\u6267\u884C4190\uFF08\u539F\u96C6\u5408+9\u4E2A\u663E\u5F0F\u5B50\u6D4B\u8BD5\uFF09\uFF0Cskipped=0\uFF1Bcoverage\u5FC5\u987B\u975E\u7A7A\uFF1B\u6536\u96C6\u6BCF\u6761failure/error\u548CDATA RACE\u6B21\u6570\u3002XML\u5B8C\u6574\u7528\u4F8B\u8EAB\u4EFD\u4FDD\u5B58\uFF0C\u6838\u5BF9\u9876\u5C42\u539F\u7528\u4F8B\u65E0\u7F3A\u5931\
        \uFF0C\u4E0D\u4EE5\u8BA1\u6570\u4EE3\u66FF\u5168\u90E8\u65AD\u8A00\u3002\\n- \u5916\u90E8\u7B7E\u540D/\u9519\u8BEF\u8DEF\u5F84/\u539F\u65AD\u8A00\u53CA\u5E76\u884C\u72B6\u6001\u5DF2\u7531\u65E2\u6709\u4EE3\u7801\u6539\u9020\u4E0E#9768\u9A8C\u8BC1\uFF1B\u672C\u8F6E\u4E0D\u4FEE\u6539oracle\u6765\u83B7\u5F97\u6210\u529F\u3002\\n- A\u5DF2\u77E5\u53EF\u80FD\u6709race/\u65AD\u8A00\u5931\u8D25\uFF1A\u5168\u90E8\u6837\u672C\u7EE7\u7EED\u6536\u96C6\uFF0C\u6807CORRECTNESS_FAILED\uFF0C\u4E0D\u80FD\u7528\u4F5C\u6B63\u5E38\u6027\u80FD\u6536\u76CA\u7684\u5408\u683C\u57FA\u7EBF\uFF1B\u4E0D\u5220\u5931\u8D25\u8F6E\u6B21\u3001\u4E0D\u81EA\u52A8\u91CD\u8DD1\u51D1\u7EFF\u8272\u3002\\n- B\u4EFB\u610Frace/\u65B0\u5931\u8D25\u6807\u56DE\u5F52/\u5F85\u6392\u67E5\uFF0C\u4E0D\u7528\u8017\u65F6\u6539\u5584\u62B5\u6D88\uFF1B\u6BCF\u4E2Asample\u7684\u5931\u8D25\u72B6\u6001\u771F\u5B9E\u4FDD\u7559\u3002\u57FA\u7840\u8BBE\u65BD\u4E2D\u65AD/\u53D6\u6D88/missing report\u6807INFRA_INVALID\uFF0C\u4E0D\u4F2A\u9020\
        \u8017\u65F6\u3002\\n- \u6BCF\u4E2Asample\u8D85\u65F6\u4E3A60\u5206\u949F\u4FDD\u62A4\u4E0A\u9650\uFF1BGo\u539F\u6BCF\u530530m\u4E0D\u53D8\u3002\u6BCF\u7EC4job\u9884\u7B97135m\u53EA\u5BB9\u7EB3\u4E24\u4E2A\u6837\u672C\u4E0E\u6536\u8BC1\uFF0C\u4E0D\u662F\u653E\u5BBD\u6D4B\u8BD5\u8D85\u65F6\u3002\\n- \u53EA\u8F93\u51FAEVIDENCE_REQUIRED/REMEASURE/\u63CF\u8FF0\u6027\u89C2\u6D4B\uFF0C\u4E0D\u9884\u6388\u6743\u201C\u6027\u80FD\u63D0\u5347/\u65E0\u56DE\u5F52\u201D\u3002\u6CA1\u6709\u5DF2\u786E\u8BA4\u4E1A\u52A1SLO\u6216\u53EF\u63A5\u53D7\u56DE\u5F52\u95E8\u69DB\uFF0C\u56DE\u5F52\u95E8\u69DB\u767B\u8BB0\u4E3A\u5F85\u786E\u5B9A\u5B9E\u9A8C\u53D8\u91CF\uFF1B\u672C\u6B21\u4E0D\u4E8B\u540E\u6309\u6837\u672C\u5236\u5B9AACCEPT\u9608\u503C\u3002\\n\\n## \u7EDF\u8BA1\u4E0E\u7ED3\u8BBA\u8FB9\u754C\\n\\n- \u6309runner\u5206\u522B\u52176\u4E2A\u539F\u59CB\u6837\u672C\u53CA3\u7EC4\u914D\u5BF9\u5DEE\u91CF\uFF1B\u62A5\u544A\u4E2D\u4F4D\u6570\u3001min/max\u3001\u5B9E\u9645\u6267\u884C\u987A\u5E8F\u3001\
        \u5168\u90E8\u5931\u8D25\u548Cfingerprint\u6F02\u79FB\u3002\\n- \u6BCF\u7EC4\u5DEE\u91CF=(B-A)/A\uFF1BA/B\u4EFB\u4E00\u6B63\u786E\u6027\u6216\u73AF\u5883\u6709\u6548\u6027\u5931\u8D25\u65F6\u5355\u5217\u63CF\u8FF0\u6027\u5DEE\u91CF\uFF0C\u4E0D\u52A0\u5165\u201C\u6B63\u5E38\u8FD0\u884C\u201D\u6027\u80FD\u805A\u5408\u3002\\n- 3\u7EC4\u6837\u672C\u53EA\u6784\u6210\u9996\u6279\u6D4B\u91CF\uFF0C\u6837\u672C\u5C11\u3001\u987A\u5E8F\u672A\u5B8C\u5168\u5E73\u8861\uFF0C\u4E0D\u58F0\u79F0\u7A33\u5B9A\u6536\u76CA\u3001\u5C3E\u90E8\u65E0\u56DE\u5F52\u6216\u7EDF\u8BA1\u663E\u8457\u3002\\n- \u672C\u8F6E\u4E0D\u65B0\u589E\u8BED\u4E49mutant\uFF0C\u6545\u4E0D\u5347\u7EA7\u4E3A\u4E25\u683CACCEPT\u6216\u91C7\u7528\u65B0\u7684\u4F18\u5316\uFF1B\u76EE\u6807\u662F\u91CF\u5316\u5DF2\u6709\u6B63\u786E\u6027\u4FEE\u590D\u5BF9CI\u8017\u65F6\u7684\u89C2\u6D4B\u5F71\u54CD\u3002\\n')\nAB_BOOTSTRAP\n"
    - name: Run A cold-cache sample
      id: sample_a
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py A
    - name: Run B cold-cache sample
      id: sample_b
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py B
    - name: Summarize pair and retain failures
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py summarize
    - name: Upload full pair evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: depinject-ab-r3-internal
        path: ab-evidence/
        retention-days: 14
        if-no-files-found: error
    needs:
    - r2-internal
  r3-hosted:
    name: R3 AB Unit (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'kubewharf/katalyst-core' && github.ref == 'refs/heads/test/ci-depinject-ab'
    env:
      PAIR_ROUND: '3'
      PAIR_RUNNER: hosted
      PAIR_ORDER: AB
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 1.18.10
        cache: false
    - name: Prepare build tools
      shell: bash
      run: "TIMEFORMAT=$'real %3R\\nuser %3U\\nsys %3S'\ntime bash -e -o pipefail <<'BUILD_TOOLS'\nif ! command -v make >/dev/null || ! command -v gcc >/dev/null || [[ ! -x /usr/bin/time ]]; then\n  . /etc/os-release\n  if [[ \"$ID\" != ubuntu || ! \"$VERSION_CODENAME\" =~ ^(jammy|noble)$ ]]; then\n    printf 'Unsupported build-tool installation environment: %s %s\\n' \"$ID\" \"$VERSION_CODENAME\" >&2\n    exit 1\n  fi\n  apt_root=$(mktemp -d \"$RUNNER_TEMP/ci-apt.XXXXXX\")\n  trap 'sudo -n rm -rf -- \"$apt_root\"' EXIT\n  mkdir -p \"$apt_root/lists/partial\"\n  printf 'deb http://archive.ubuntu.com/ubuntu %s main universe\\ndeb http://archive.ubuntu.com/ubuntu %s-updates main universe\\ndeb http://archive.ubuntu.com/ubuntu %s-security main universe\\n' \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" \"$VERSION_CODENAME\" > \"$apt_root/sources.list\"\n  apt_options=(-o \"Dir::Etc::sourcelist=$apt_root/sources.list\" -o \"Dir::Etc::sourceparts=-\" -o \"Dir::State::lists=$apt_root/lists\" -o APT::Update::Error-Mode=any\
        \ -o Acquire::Retries=0 -o Acquire::http::Timeout=30)\n  sudo -n apt-get \"${apt_options[@]}\" update\n  sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \"${apt_options[@]}\" install -y --no-install-recommends build-essential time\nfi\ncommand -v make\ncommand -v gcc\n/usr/bin/time --version\nBUILD_TOOLS\n"
    - name: Prepare frozen A/B harness
      shell: bash
      run: "python3 - <<'AB_BOOTSTRAP'\nimport pathlib\np = pathlib.Path('ab-evidence')\np.mkdir(exist_ok=True)\n(p / 'run-ab-sample.py').write_text('#!/usr/bin/env python3\\n\"\"\"Cold-cache A/B CI sample collection; never changes the tested revisions.\"\"\"\\nimport hashlib\\nimport json\\nimport os\\nimport pathlib\\nimport platform\\nimport re\\nimport signal\\nimport shutil\\nimport subprocess\\nimport sys\\nimport time\\nimport xml.etree.ElementTree as ET\\n\\nREVISIONS = {\\n    \\'A\\': \\'2bebfcdf128df6a02c41d232c9e779447d19c332\\',\\n    \\'B\\': \\'14c0f514628179b316b10b7bc3dd1d82fbdd6dde\\',\\n}\\nEXPECTED = {\\'A\\': 4181, \\'B\\': 4190}\\nROOT = pathlib.Path(os.environ.get(\\'GITHUB_WORKSPACE\\', \\'.\\')).resolve()\\nOUT = ROOT / \\'ab-evidence\\'\\nDP = \\'github.com/kubewharf/katalyst-core/pkg/agent/qrm-plugins/cpu/dynamicpolicy\\'\\n\\n\\ndef command(args, cwd=None, env=None):\\n    p = subprocess.run(args, cwd=cwd, env=env, text=True,\\n                       stdout=subprocess.PIPE,\
        \ stderr=subprocess.STDOUT)\\n    return {\\'exit\\': p.returncode, \\'output\\': p.stdout.strip()}\\n\\n\\ndef read(path):\\n    p = pathlib.Path(path)\\n    try:\\n        return p.read_text().strip() if p.is_file() else None\\n    except OSError:\\n        return None\\n\\n\\ndef digest(path):\\n    p = pathlib.Path(path)\\n    return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None\\n\\n\\ndef cgroups():\\n    result = []\\n    for entry in pathlib.Path(\\'/proc/self/cgroup\\').read_text().splitlines():\\n        hierarchy, controllers, member = entry.split(\\':\\', 2)\\n        for mount in pathlib.Path(\\'/proc/self/mountinfo\\').read_text().splitlines():\\n            left, right = mount.split(\\' - \\', 1)\\n            fields, fs = left.split(), right.split()\\n            if fs[0] not in (\\'cgroup\\', \\'cgroup2\\'):\\n                continue\\n            if hierarchy == \\'0\\' and fs[0] != \\'cgroup2\\':\\n                continue\\n            if\
        \ hierarchy != \\'0\\' and (fs[0] != \\'cgroup\\' or not set(controllers.split(\\',\\')).intersection(fs[2].split(\\',\\'))):\\n                continue\\n            mount_root, mount_dir = fields[3], fields[4]\\n            base = pathlib.Path(mount_dir)\\n            if member == mount_root:\\n                leaf = base\\n            elif member.startswith(mount_root.rstrip(\\'/\\') + \\'/\\'):\\n                leaf = base / member[len(mount_root):].lstrip(\\'/\\')\\n            else:\\n                leaf = base / member.lstrip(\\'/\\')\\n            candidates = [leaf]\\n            if leaf.is_dir():\\n                candidates.extend(p for p in leaf.parents if p == base or base in p.parents)\\n            for path in candidates:\\n                names = (\\'cpu.max\\', \\'cpuset.cpus.effective\\', \\'memory.max\\', \\'memory.current\\', \\'cpu.stat\\', \\'memory.peak\\') if fs[0] == \\'cgroup2\\' else (\\'cpu.cfs_quota_us\\', \\'cpu.cfs_period_us\\', \\'cpu.stat\\', \\\
        'cpuset.cpus\\', \\'memory.limit_in_bytes\\', \\'memory.usage_in_bytes\\', \\'memory.max_usage_in_bytes\\')\\n                result.append({\\'hierarchy\\': hierarchy, \\'controllers\\': controllers,\\n                               \\'path\\': str(path), \\'exists\\': path.is_dir(),\\n                               \\'values\\': {name: read(path / name) for name in names}})\\n    return result\\n\\n\\ndef profile(worktree, env):\\n    cpuinfo = pathlib.Path(\\'/proc/cpuinfo\\').read_text()\\n    disk = shutil.disk_usage(worktree)\\n    value = {\\n        \\'utc\\': time.strftime(\\'%Y-%m-%dT%H:%M:%SZ\\', time.gmtime()),\\n        \\'runner_name\\': os.environ.get(\\'RUNNER_NAME\\'),\\n        \\'runner_arch\\': os.environ.get(\\'RUNNER_ARCH\\'),\\n        \\'runner_os\\': os.environ.get(\\'RUNNER_OS\\'),\\n        \\'image_os\\': os.environ.get(\\'ImageOS\\'),\\n        \\'image_version\\': os.environ.get(\\'ImageVersion\\'),\\n        \\'kernel\\': platform.release(), \\'machine\\\
        ': platform.machine(),\\n        \\'cpu_models\\': sorted({l.split(\\':\\', 1)[1].strip() for l in cpuinfo.splitlines() if l.startswith(\\'model name\\')}),\\n        \\'logical_cpu\\': os.cpu_count(), \\'affinity_cpu\\': sorted(os.sched_getaffinity(0)),\\n        \\'loadavg\\': list(os.getloadavg()), \\'meminfo\\': read(\\'/proc/meminfo\\'),\\n        \\'cgroup\\': read(\\'/proc/self/cgroup\\'), \\'cgroup_limits\\': cgroups(),\\n        \\'cpu_pressure\\': read(\\'/proc/pressure/cpu\\'),\\n        \\'memory_pressure\\': read(\\'/proc/pressure/memory\\'),\\n        \\'disk_total\\': disk.total, \\'disk_free\\': disk.free,\\n        \\'go\\': command([\\'go\\', \\'version\\'], env=env),\\n        \\'gcc\\': command([\\'gcc\\', \\'--version\\'], env=env),\\n        \\'make\\': command([\\'make\\', \\'--version\\'], env=env),\\n        \\'go_env\\': command([\\'go\\', \\'env\\', \\'CGO_ENABLED\\', \\'GOPROXY\\', \\'GOPATH\\', \\'GOMODCACHE\\', \\'GOCACHE\\', \\'GOVERSION\\'], env=env),\\\
        n        \\'go_contract\\': command([\\'go\\', \\'env\\', \\'CGO_ENABLED\\', \\'GOPROXY\\', \\'GOVERSION\\', \\'GOOS\\', \\'GOARCH\\'], env=env),\\n        \\'git\\': command([\\'git\\', \\'rev-parse\\', \\'HEAD\\'], cwd=worktree),\\n        \\'source_sha256\\': {name: digest(worktree / name) for name in (\\'go.mod\\', \\'go.sum\\', \\'Makefile\\')},\\n    }\\n    return value\\n\\n\\ndef fingerprint(value):\\n    names = (\\'runner_name\\', \\'runner_arch\\', \\'runner_os\\', \\'image_os\\', \\'image_version\\',\\n             \\'kernel\\', \\'machine\\', \\'cpu_models\\', \\'logical_cpu\\', \\'affinity_cpu\\',\\n             \\'go\\', \\'go_contract\\', \\'gcc\\', \\'make\\', \\'source_sha256\\')\\n    result = {k: value[k] for k in names}\\n    limits = (\\'cpu.max\\', \\'cpuset.cpus.effective\\', \\'memory.max\\', \\'cpu.cfs_quota_us\\',\\n              \\'cpu.cfs_period_us\\', \\'cpuset.cpus\\', \\'memory.limit_in_bytes\\')\\n    result[\\'cgroup_limits\\'] = [dict(path=p[\\\
        'path\\'], exists=p[\\'exists\\'],\\n        values={k: v for k, v in p[\\'values\\'].items() if k in limits}) for p in value[\\'cgroup_limits\\']]\\n    return result\\n\\n\\ndef oracle(folder, variant):\\n    log_path = folder / \\'unit.log\\'\\n    text = log_path.read_text(errors=\\'replace\\') if log_path.is_file() else \\'\\'\\n    errors = []\\n    report = folder / \\'report.xml\\'\\n    result = {\\'race_count\\': text.count(\\'WARNING: DATA RACE\\'),\\n              \\'build_failed_count\\': len(re.findall(r\\'\\\\[build failed\\\\]\\', text)),\\n              \\'panic_count\\': len(re.findall(r\\'^panic:\\', text, re.M)),\\n              \\'package_ok_count\\': len(re.findall(r\\'^ok\\\\s+\\', text, re.M)),\\n              \\'package_fail_lines\\': re.findall(r\\'^FAIL\\\\s+.*$\\', text, re.M),\\n              \\'dynamicpolicy_result\\': re.findall(r\\'^(?:ok\\\\s+|FAIL\\\\s+)\\' + re.escape(DP) + r\\'\\\\s+.*$\\', text, re.M),\\n              \\'coverage_bytes\\': (folder\
        \ / \\'coverage.txt\\').stat().st_size if (folder / \\'coverage.txt\\').is_file() else 0}\\n    if report.is_file():\\n        try:\\n            tree = ET.parse(report)\\n            cases = list(tree.iter(\\'testcase\\'))\\n            skipped = [c for c in cases if c.find(\\'skipped\\') is not None]\\n            executed = [c for c in cases if c.find(\\'skipped\\') is None]\\n            failures = [c for c in executed if c.find(\\'failure\\') is not None or c.find(\\'error\\') is not None]\\n            result.update(executed=len(executed), skipped=len(skipped), failed=len(failures),\\n                          failures=[{\\'classname\\': c.get(\\'classname\\'), \\'name\\': c.get(\\'name\\')} for c in failures])\\n            identity = [{\\'classname\\': c.get(\\'classname\\'), \\'name\\': c.get(\\'name\\'), \\'time\\': c.get(\\'time\\'),\\n                         \\'skipped\\': c.find(\\'skipped\\') is not None} for c in cases]\\n            (folder / \\'testcases.json\\\
        ').write_text(json.dumps(identity, indent=2))\\n            result[\\'dynamicpolicy_testcases\\'] = [c for c in identity if c[\\'classname\\'] == DP]\\n            if len(executed) != EXPECTED[variant]:\\n                errors.append(\\'testcase count differs from frozen revision expectation\\')\\n            if skipped or failures:\\n                errors.append(\\'testcase failure/error or skipped\\')\\n        except ET.ParseError as exc:\\n            errors.append(\\'report parse error: \\' + str(exc))\\n    else:\\n        errors.append(\\'report missing\\')\\n    if not result[\\'coverage_bytes\\']:\\n        errors.append(\\'coverage missing or empty\\')\\n    if result[\\'race_count\\'] or result[\\'build_failed_count\\'] or result[\\'panic_count\\'] or result[\\'package_fail_lines\\']:\\n        errors.append(\\'race/build/panic/package failure\\')\\n    result[\\'errors\\'] = errors\\n    result[\\'pass\\'] = not errors\\n    return result\\n\\n\\ndef sample(variant):\\\
        n    round_no = os.environ[\\'PAIR_ROUND\\']\\n    side = os.environ[\\'PAIR_RUNNER\\']\\n    folder = OUT / (variant + \\'-r\\' + round_no + \\'-\\' + side)\\n    folder.mkdir(parents=True, exist_ok=False)\\n    runtime = pathlib.Path(os.environ[\\'RUNNER_TEMP\\']) / (\\'ci-depinject-ab-\\' + os.environ[\\'GITHUB_RUN_ID\\'] + \\'-\\' + round_no + \\'-\\' + variant)\\n    runtime.mkdir(parents=True, exist_ok=False)\\n    worktree = runtime / \\'source\\'\\n    cache = runtime / \\'cache\\'\\n    env = dict(os.environ)\\n    env.update(GOPATH=str(cache / \\'gopath\\'), GOMODCACHE=str(cache / \\'modules\\'),\\n               GOCACHE=str(cache / \\'build\\'), GOTMPDIR=str(cache / \\'tmp\\'), CGO_ENABLED=\\'1\\')\\n    for path in (cache / \\'gopath\\', cache / \\'modules\\', cache / \\'build\\', cache / \\'tmp\\'):\\n        path.mkdir(parents=True)\\n    env[\\'PATH\\'] = str(cache / \\'gopath\\' / \\'bin\\') + \\':\\' + env[\\'PATH\\']\\n    result = {\\'variant\\': variant, \\'revision\\\
        ': REVISIONS[variant], \\'round\\': round_no,\\n              \\'runner\\': side, \\'order\\': os.environ[\\'PAIR_ORDER\\'], \\'status\\': \\'INFRA_INVALID\\',\\n              \\'install_exit\\': None, \\'make_exit\\': None, \\'junit_exit\\': None}\\n    try:\\n        subprocess.run([\\'git\\', \\'worktree\\', \\'add\\', \\'--detach\\', str(worktree), REVISIONS[variant]], cwd=ROOT, check=True)\\n        before = profile(worktree, env)\\n        if not pathlib.Path(\\'/usr/bin/time\\').is_file():\\n            raise RuntimeError(\\'GNU time missing before timed workload\\')\\n        (folder / \\'before.json\\').write_text(json.dumps(before, indent=2))\\n        result[\\'fingerprint\\'] = fingerprint(before)\\n        result[\\'fingerprint_sha256\\'] = hashlib.sha256(json.dumps(result[\\'fingerprint\\'], sort_keys=True).encode()).hexdigest()\\n        if before[\\'go\\'][\\'output\\'] != \\'go version go1.18.10 linux/amd64\\':\\n            raise RuntimeError(\\'unexpected Go runtime:\
        \ \\' + before[\\'go\\'][\\'output\\'])\\n        start = time.monotonic()\\n        with (folder / \\'install.log\\').open(\\'w\\') as log:\\n            install = subprocess.run([\\'go\\', \\'install\\', \\'github.com/jstemmer/go-junit-report/v2@v2.1.0\\'],\\n                cwd=worktree, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=3600)\\n        result[\\'install_exit\\'] = install.returncode\\n        if install.returncode != 0:\\n            result[\\'unit_wall_s\\'] = time.monotonic() - start\\n            raise RuntimeError(\\'go-junit-report installation failed\\')\\n        make_start = time.monotonic()\\n        shell = r\\'\\'\\'set +e\\nset -o pipefail\\n/usr/bin/time -f \\'AB_TIME user_s=%U sys_s=%S max_rss_kb=%M elapsed_s=%e exit=%x\\' -o \"$AB_SAMPLE/make-time.txt\" sudo -n env \"PATH=$PATH\" \"GOPATH=$GOPATH\" \"GOMODCACHE=$GOMODCACHE\" \"GOCACHE=$GOCACHE\" \"GOTMPDIR=$GOTMPDIR\" \"CGO_ENABLED=$CGO_ENABLED\" make test 2>&1 | go-junit-report -parser gotest\
        \ -set-exit-code -iocopy -out \"$AB_SAMPLE/report.xml\"\\nrcs=(\"${PIPESTATUS[@]}\")\\nprintf \\'%s %s\\\\n\\' \"${rcs[0]}\" \"${rcs[1]}\" > \"$AB_SAMPLE/pipeline-exit.txt\"\\nexit 0\\n\\'\\'\\'\\n        env[\\'AB_SAMPLE\\'] = str(folder)\\n        with (folder / \\'unit.log\\').open(\\'w\\') as log:\\n            child = subprocess.Popen([\\'bash\\', \\'-c\\', shell], cwd=worktree, env=env,\\n                                     stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\\n            try:\\n                child.wait(timeout=max(1, 3600 - (time.monotonic() - start)))\\n            except subprocess.TimeoutExpired:\\n                # Terminate the entire test pipeline before collecting/cleaning its worktree.\\n                try:\\n                    os.killpg(child.pid, signal.SIGTERM)\\n                    child.wait(timeout=10)\\n                except (ProcessLookupError, subprocess.TimeoutExpired):\\n                    try:\\n                       \
        \ os.killpg(child.pid, signal.SIGKILL)\\n                    except ProcessLookupError:\\n                        pass\\n                    child.wait()\\n                result[\\'unit_wall_s\\'] = time.monotonic() - start\\n                raise RuntimeError(\\'sample protection timeout; not a completed performance sample\\')\\n        result[\\'make_wall_s\\'] = time.monotonic() - make_start\\n        result[\\'unit_wall_s\\'] = time.monotonic() - start\\n        make_exit, junit_exit = map(int, (folder / \\'pipeline-exit.txt\\').read_text().split())\\n        result.update(make_exit=make_exit, junit_exit=junit_exit,\\n                      gnu_time=read(folder / \\'make-time.txt\\'))\\n        coverage = worktree / \\'coverage.txt\\'\\n        if coverage.is_file():\\n            shutil.copy2(coverage, folder / \\'coverage.txt\\')\\n            result[\\'coverage_sha256\\'] = digest(folder / \\'coverage.txt\\')\\n        result[\\'oracle\\'] = oracle(folder, variant)\\n    \
        \    result[\\'status\\'] = \\'PASS\\' if result[\\'oracle\\'][\\'pass\\'] and make_exit == 0 and junit_exit == 0 else \\'CORRECTNESS_FAILED\\'\\n        if result[\\'oracle\\'].get(\\'executed\\', 0) == 0 or not result[\\'oracle\\'][\\'coverage_bytes\\']:\\n            result[\\'status\\'] = \\'INFRA_INVALID\\'\\n        after = profile(worktree, env)\\n        (folder / \\'after.json\\').write_text(json.dumps(after, indent=2))\\n        result[\\'sample_static_drift\\'] = fingerprint(after) != fingerprint(before)\\n        if result[\\'sample_static_drift\\']:\\n            result[\\'status\\'] = \\'DRIFT\\'\\n    except Exception as exc:\\n        result[\\'infrastructure_error\\'] = str(exc)\\n        print(\\'AB_INFRA_ERROR\\', variant, str(exc), flush=True)\\n    finally:\\n        (folder / \\'sample.json\\').write_text(json.dumps(result, indent=2))\\n        # Preserve only structured summary in the live job log; full logs are artifacts.\\n        compact = {k: v for k, v\
        \ in result.items() if k not in (\\'fingerprint\\', \\'oracle\\')}\\n        compact[\\'oracle\\'] = {k: v for k, v in result.get(\\'oracle\\', {}).items() if k != \\'dynamicpolicy_testcases\\'}\\n        print(\\'AB_SAMPLE \\' + json.dumps(compact, sort_keys=True), flush=True)\\n        if worktree.is_dir():\\n            subprocess.run([\\'sudo\\', \\'-n\\', \\'chown\\', \\'-R\\', str(os.getuid()) + \\':\\' + str(os.getgid()), str(runtime)], check=False)\\n            removed = subprocess.run([\\'git\\', \\'worktree\\', \\'remove\\', \\'--force\\', str(worktree)], cwd=ROOT).returncode\\n            if removed == 0:\\n                # Go\\'s downloaded module trees are read-only even after chown.\\n                subprocess.run([\\'sudo\\', \\'-n\\', \\'rm\\', \\'-rf\\', \\'--\\', str(runtime)], check=True)\\n    return 0 if result[\\'status\\'] == \\'PASS\\' else 1\\n\\n\\ndef summarize():\\n    samples = [json.loads(p.read_text()) for p in sorted(OUT.glob(\\'*/sample.json\\\
        '))]\\n    drift = len(samples) != 2 or samples[0].get(\\'fingerprint\\') != samples[1].get(\\'fingerprint\\')\\n    pair = {\\'round\\': os.environ[\\'PAIR_ROUND\\'], \\'runner\\': os.environ[\\'PAIR_RUNNER\\'],\\n            \\'order\\': os.environ[\\'PAIR_ORDER\\'], \\'static_fingerprint_match\\': not drift,\\n            \\'samples\\': samples, \\'normal_performance_pair\\': not drift and all(s[\\'status\\'] == \\'PASS\\' for s in samples)}\\n    by_variant = {s[\\'variant\\']: s for s in samples}\\n    if all(v in by_variant and \\'unit_wall_s\\' in by_variant[v] for v in (\\'A\\', \\'B\\')):\\n        a, b = by_variant[\\'A\\'][\\'unit_wall_s\\'], by_variant[\\'B\\'][\\'unit_wall_s\\']\\n        pair[\\'descriptive_unit_ratio_B_over_A\\'] = b / a\\n        pair[\\'descriptive_unit_delta_s\\'] = b - a\\n    if all(v in by_variant and \\'oracle\\' in by_variant[v] for v in (\\'A\\', \\'B\\')):\\n        def top_names(s):\\n            return {c[\\'name\\'] for c in s[\\'oracle\\\
        '][\\'dynamicpolicy_testcases\\'] if \\'/\\' not in c[\\'name\\']}\\n        pair[\\'dynamicpolicy_missing_top_tests_in_B\\'] = sorted(top_names(by_variant[\\'A\\']) - top_names(by_variant[\\'B\\']))\\n    (OUT / \\'pair.json\\').write_text(json.dumps(pair, indent=2))\\n    summary = [\\'## Cold-cache A/B pair\\', \\'\\', \\'| Variant | status | unit wall s | make wall s | executed | failed | skipped | race |\\', \\'|---|---|---:|---:|---:|---:|---:|---:|\\']\\n    for s in samples:\\n        o = s.get(\\'oracle\\', {})\\n        summary.append(\\'| {variant} | {status} | {unit_wall_s} | {make_wall_s} | {executed} | {failed} | {skipped} | {race} |\\'.format(\\n            variant=s[\\'variant\\'], status=s[\\'status\\'], unit_wall_s=s.get(\\'unit_wall_s\\'), make_wall_s=s.get(\\'make_wall_s\\'),\\n            executed=o.get(\\'executed\\'), failed=o.get(\\'failed\\'), skipped=o.get(\\'skipped\\'), race=o.get(\\'race_count\\')))\\n    summary.extend([\\'\\', \\'All failures retained.\
        \ Normal-performance eligibility: \\' + str(pair[\\'normal_performance_pair\\']), \\'\\', \\'```json\\', json.dumps(pair, indent=2), \\'```\\', \\'\\'])\\n    with open(os.environ[\\'GITHUB_STEP_SUMMARY\\'], \\'a\\') as f:\\n        f.write(\\'\\\\n\\'.join(summary))\\n    print(\\'AB_PAIR \\' + json.dumps({k: v for k, v in pair.items() if k != \\'samples\\'}, sort_keys=True))\\n    return 0\\n\\n\\nif __name__ == \\'__main__\\':\\n    sys.exit(summarize() if sys.argv[1] == \\'summarize\\' else sample(sys.argv[1]))\\n')\n(p / 'experiment-contract.md').write_text('# CPU dynamicpolicy \u4E09\u8F6E A/B \u5B9E\u9A8C\u5408\u540C\\n\\n## \u51BB\u7ED3\u8303\u56F4\\n\\n- A\uFF1A\u539F mockey \u57FA\u7EBF `2bebfcdf128df6a02c41d232c9e779447d19c332`\u3002\\n- B\uFF1A\u8DEF\u7EBF2\u4F9D\u8D56\u6CE8\u5165\u4FEE\u590D `14c0f514628179b316b10b7bc3dd1d82fbdd6dde`\u3002\\n- \u5DEE\u91CF\uFF1Adynamicpolicy \u9876\u5C42\u56DB\u6587\u4EF6\u6539\u9020\uFF1B\u4E0D\u91C7\u7528\u5220\u9664 t.Parallel \u7684\
        \u7248\u672C\uFF0C\u4E0D\u6539\u6D4B\u8BD5/\u751F\u4EA7\u6E90\u7801\u3002\\n- \u5355\u8F6E\u9A8C\u8BC1 #9768 \u53EA\u4F5C\u4E3A\u5DF2\u901A\u8FC7\u7684\u6B63\u786E\u6027\u65C1\u8BC1\uFF0C\u4E0D\u6DF7\u5165\u672C\u6B21\u914D\u5BF9\u7EDF\u8BA1\u3002\\n- \u5404 runner 3 \u4E2A\u72EC\u7ACB\u914D\u5BF9 job\uFF1B\u987A\u5E8F R1=A/B\uFF0CR2=B/A\uFF0CR3=A/B\u3002\u6BCF\u7EC4\u4E24\u7248\u672C\u5728\u540C\u4E00\u4E2A job/\u540C\u4E00\u53F0\u673A\u5668\u8FDE\u7EED\u8FD0\u884C\u3002\u5404\u8F6E\u901A\u8FC7 needs \u4E32\u8054\uFF0Cinternal \u4E0E hosted \u540C\u65F6\u8FD0\u884C\u4F46\u4E0D\u5171\u4EAB\u673A\u5668\uFF0C\u4E0D\u5728\u540C\u4E00 runner \u5E76\u53D1\u591A\u8F6E\u3002\\n- \u4E3B\u4ED3\u4EC5\u5EFA\u624B\u52A8\u89E6\u53D1\u4E34\u65F6\u5206\u652F `test/ci-depinject-ab`\uFF0C\u4E0D\u6539\u9ED8\u8BA4\u5206\u652F\u6216\u5171\u4EAB runner \u914D\u7F6E\uFF1B\u9A8C\u540E\u5220\u9664\u5E76 ls-remote \u6838\u9A8C\u3002\u672C\u5730\u4E34\u65F6 worktree \u4E00\u5E76\u6E05\u7406\uFF0Cfork B \u4FDD\
        \u7559\u4E0D\u53D8\u3002\\n\\n## \u6D4B\u91CF\u5408\u540C\\n\\n- Linux amd64\uFF1BGo 1.18.10\uFF1BCGO_ENABLED=1\uFF1Binternal=`vke-self-hosted`\uFF0Chosted=`ubuntu-24.04`\u3002\\n- \u539F Makefile \u7684 `make test` \u547D\u4EE4\u4E0D\u53D8\uFF1A`-v -race -covermode=atomic -coverpkg=./... -parallel=16 -p=16 -timeout=30m -gcflags=all=\"-l\"`\uFF0C\u539F\u5305\u8FC7\u6EE4\u4E0D\u53D8\u3002\\n- \u6BCF\u4E2A sample \u5728\u72EC\u7ACB worktree/\u72EC\u7ACB GOPATH\u3001GOMODCACHE\u3001GOCACHE\u3001GOTMPDIR \u5185\u8FD0\u884C\uFF1B\u65E0\u9884\u70ED\u3001\u65E0\u590D\u7528 build/module/test \u7F13\u5B58\u3002\u6BCF\u4E2A sample \u6536\u8BC1\u540E\u6E05\u7406\u81EA\u5DF1\u521B\u5EFA\u7684\u7F13\u5B58\uFF0C\u907F\u514D\u4E0B\u4E00\u6837\u672C\u78C1\u76D8\u4E0D\u8DB3\u3002OS page cache\u4E0D\u4E3B\u52A8\u6E05\u7406\uFF0C\u8BB0\u5F55\u987A\u5E8F\uFF1B\u8DE8\u7248\u672C\u5148\u540E\u6548\u5E94\u7531AB/BA\u4EA4\u66FF\u89C2\u6D4B\uFF0C\u4E0D\u80FD\u5BA3\u79F0\u5DF2\u5F7B\u5E95\u6D88\u9664\u3002\
        \\n- \u4E3B\u6307\u6807\uFF1A`unit_wall_s`\uFF0C\u4ECE\u5B89\u88C5 go-junit-report/v2@v2.1.0 \u5F00\u59CB\u5230 make test/JUnit \u7BA1\u9053\u9000\u51FA\uFF0C\u5305\u542B\u51B7\u4E0B\u8F7D/\u7F16\u8BD1\u4E0Erace\u8986\u76D6\u7387\u6D4B\u8BD5\uFF0C\u6392\u9664 checkout/setup-go/build-tools \u5B89\u88C5\u3001\u73AF\u5883\u91C7\u96C6\u3001oracle\u4E0E\u6536\u8BC1\u3002\\n- \u6B21\u6307\u6807\uFF1A`make_wall_s`\uFF08make test\u672C\u8EAB\u7684\u51B7\u7F16\u8BD1\u3001\u63D2\u6869\u53CA\u6D4B\u8BD5\uFF09\uFF1BGNU time user/sys/maxRSS\uFF1Bdynamicpolicy\u5305\u7684go test\u62A5\u544A\u8017\u65F6\uFF08\u72EC\u7ACB\u8FB9\u754C\uFF0C\u4E0D\u5916\u63A8\u5230\u5168\u4ED3\uFF09\u3002\\n- \u6BCF\u4E2Asample\u5747\u4FDD\u5B58\u8BA1\u65F6\u3001\u5B8C\u6574log\u3001report.xml\u3001coverage.txt\u3001\u8986\u76D6\u7387sha256\u3001go.mod/go.sum/Makefile\u6458\u8981\u3001\u5B9E\u9645\u9000\u51FA\u7801\u4EE5\u53CAbefore/after environment JSON\u3002\u73AF\u5883\u5305\u62ECrunner/image\u3001kernel\u3001\
        CPU model\u3001logical/affinity CPUs\u3001cgroup leaf\u53CA\u7956\u5148\u9650\u989D\u3001\u5185\u5B58\u3001CPU pressure/loadavg\u3001\u78C1\u76D8\u7A7A\u95F4\u3001Go/GCC/tool\u94FE\u3002\\n- \u6BCF\u7EC4A/B\u6838\u5BF9static fingerprint\uFF1BCPU/cgroup\u9650\u989D\u3001\u4F9D\u8D56\u3001\u5DE5\u5177\u94FE\u6216kernel\u7B49\u4E0D\u540C\u5219\u6807DRIFT\uFF0C\u4FDD\u7559\u6837\u672C\u4F46\u4E0D\u7EB3\u5165\u6027\u80FD\u7ED3\u8BBA\u3002load/pressure\u52A8\u6001\u91CF\u53EA\u4F5C\u6DF7\u6742\u8BC1\u636E\uFF0C\u4E0D\u4E8B\u540E\u5220\u201C\u6162\u201D\u6837\u672C\u3002\\n\\n## Oracle\u53CA\u505C\u6B62\u89C4\u5219\\n\\n- A\u5E94\u6267\u884C4181 testcase\uFF1BB\u5E94\u6267\u884C4190\uFF08\u539F\u96C6\u5408+9\u4E2A\u663E\u5F0F\u5B50\u6D4B\u8BD5\uFF09\uFF0Cskipped=0\uFF1Bcoverage\u5FC5\u987B\u975E\u7A7A\uFF1B\u6536\u96C6\u6BCF\u6761failure/error\u548CDATA RACE\u6B21\u6570\u3002XML\u5B8C\u6574\u7528\u4F8B\u8EAB\u4EFD\u4FDD\u5B58\uFF0C\u6838\u5BF9\u9876\u5C42\u539F\u7528\u4F8B\u65E0\u7F3A\u5931\
        \uFF0C\u4E0D\u4EE5\u8BA1\u6570\u4EE3\u66FF\u5168\u90E8\u65AD\u8A00\u3002\\n- \u5916\u90E8\u7B7E\u540D/\u9519\u8BEF\u8DEF\u5F84/\u539F\u65AD\u8A00\u53CA\u5E76\u884C\u72B6\u6001\u5DF2\u7531\u65E2\u6709\u4EE3\u7801\u6539\u9020\u4E0E#9768\u9A8C\u8BC1\uFF1B\u672C\u8F6E\u4E0D\u4FEE\u6539oracle\u6765\u83B7\u5F97\u6210\u529F\u3002\\n- A\u5DF2\u77E5\u53EF\u80FD\u6709race/\u65AD\u8A00\u5931\u8D25\uFF1A\u5168\u90E8\u6837\u672C\u7EE7\u7EED\u6536\u96C6\uFF0C\u6807CORRECTNESS_FAILED\uFF0C\u4E0D\u80FD\u7528\u4F5C\u6B63\u5E38\u6027\u80FD\u6536\u76CA\u7684\u5408\u683C\u57FA\u7EBF\uFF1B\u4E0D\u5220\u5931\u8D25\u8F6E\u6B21\u3001\u4E0D\u81EA\u52A8\u91CD\u8DD1\u51D1\u7EFF\u8272\u3002\\n- B\u4EFB\u610Frace/\u65B0\u5931\u8D25\u6807\u56DE\u5F52/\u5F85\u6392\u67E5\uFF0C\u4E0D\u7528\u8017\u65F6\u6539\u5584\u62B5\u6D88\uFF1B\u6BCF\u4E2Asample\u7684\u5931\u8D25\u72B6\u6001\u771F\u5B9E\u4FDD\u7559\u3002\u57FA\u7840\u8BBE\u65BD\u4E2D\u65AD/\u53D6\u6D88/missing report\u6807INFRA_INVALID\uFF0C\u4E0D\u4F2A\u9020\
        \u8017\u65F6\u3002\\n- \u6BCF\u4E2Asample\u8D85\u65F6\u4E3A60\u5206\u949F\u4FDD\u62A4\u4E0A\u9650\uFF1BGo\u539F\u6BCF\u530530m\u4E0D\u53D8\u3002\u6BCF\u7EC4job\u9884\u7B97135m\u53EA\u5BB9\u7EB3\u4E24\u4E2A\u6837\u672C\u4E0E\u6536\u8BC1\uFF0C\u4E0D\u662F\u653E\u5BBD\u6D4B\u8BD5\u8D85\u65F6\u3002\\n- \u53EA\u8F93\u51FAEVIDENCE_REQUIRED/REMEASURE/\u63CF\u8FF0\u6027\u89C2\u6D4B\uFF0C\u4E0D\u9884\u6388\u6743\u201C\u6027\u80FD\u63D0\u5347/\u65E0\u56DE\u5F52\u201D\u3002\u6CA1\u6709\u5DF2\u786E\u8BA4\u4E1A\u52A1SLO\u6216\u53EF\u63A5\u53D7\u56DE\u5F52\u95E8\u69DB\uFF0C\u56DE\u5F52\u95E8\u69DB\u767B\u8BB0\u4E3A\u5F85\u786E\u5B9A\u5B9E\u9A8C\u53D8\u91CF\uFF1B\u672C\u6B21\u4E0D\u4E8B\u540E\u6309\u6837\u672C\u5236\u5B9AACCEPT\u9608\u503C\u3002\\n\\n## \u7EDF\u8BA1\u4E0E\u7ED3\u8BBA\u8FB9\u754C\\n\\n- \u6309runner\u5206\u522B\u52176\u4E2A\u539F\u59CB\u6837\u672C\u53CA3\u7EC4\u914D\u5BF9\u5DEE\u91CF\uFF1B\u62A5\u544A\u4E2D\u4F4D\u6570\u3001min/max\u3001\u5B9E\u9645\u6267\u884C\u987A\u5E8F\u3001\
        \u5168\u90E8\u5931\u8D25\u548Cfingerprint\u6F02\u79FB\u3002\\n- \u6BCF\u7EC4\u5DEE\u91CF=(B-A)/A\uFF1BA/B\u4EFB\u4E00\u6B63\u786E\u6027\u6216\u73AF\u5883\u6709\u6548\u6027\u5931\u8D25\u65F6\u5355\u5217\u63CF\u8FF0\u6027\u5DEE\u91CF\uFF0C\u4E0D\u52A0\u5165\u201C\u6B63\u5E38\u8FD0\u884C\u201D\u6027\u80FD\u805A\u5408\u3002\\n- 3\u7EC4\u6837\u672C\u53EA\u6784\u6210\u9996\u6279\u6D4B\u91CF\uFF0C\u6837\u672C\u5C11\u3001\u987A\u5E8F\u672A\u5B8C\u5168\u5E73\u8861\uFF0C\u4E0D\u58F0\u79F0\u7A33\u5B9A\u6536\u76CA\u3001\u5C3E\u90E8\u65E0\u56DE\u5F52\u6216\u7EDF\u8BA1\u663E\u8457\u3002\\n- \u672C\u8F6E\u4E0D\u65B0\u589E\u8BED\u4E49mutant\uFF0C\u6545\u4E0D\u5347\u7EA7\u4E3A\u4E25\u683CACCEPT\u6216\u91C7\u7528\u65B0\u7684\u4F18\u5316\uFF1B\u76EE\u6807\u662F\u91CF\u5316\u5DF2\u6709\u6B63\u786E\u6027\u4FEE\u590D\u5BF9CI\u8017\u65F6\u7684\u89C2\u6D4B\u5F71\u54CD\u3002\\n')\nAB_BOOTSTRAP\n"
    - name: Run A cold-cache sample
      id: sample_a
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py A
    - name: Run B cold-cache sample
      id: sample_b
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py B
    - name: Summarize pair and retain failures
      if: always() && !cancelled()
      shell: bash
      run: python3 ab-evidence/run-ab-sample.py summarize
    - name: Upload full pair evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: depinject-ab-r3-hosted
        path: ab-evidence/
        retention-days: 14
        if-no-files-found: error
    needs:
    - r2-hosted
