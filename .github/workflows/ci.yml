name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Keep pull request code on GitHub-hosted runners, outside internal infrastructure.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go modules
        run: |
          go mod tidy && git add go.* &&
          git diff --cached --exit-code || (echo 'Please run "go mod tidy" to sync Go modules' && exit 1);
      - name: Verify gofumpt
        run: |
          echo "refer to https://github.com/mvdan/gofumpt for detailed info" &&
          GO111MODULE=on go install mvdan.cc/gofumpt@v0.4.0 &&
          make fmt-strict && git add pkg cmd &&
          git diff --cached --exit-code || (echo 'Please run "make fmt-strict" to verify fmt' && exit 1);

  vet:
    name: Vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify govet
        run: |
          make vet && git add pkg cmd &&
          git diff --cached --exit-code || (echo 'Please run "make vet" to verify govet' && exit 1);

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v4
        with:
          args: --verbose --out-${NO_FUTURE}format colored-line-number --config .golangci.yml
          version: v1.52.2
          skip-cache: true

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make all-binaries

  parallel:
    name: Parallel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check parallel
        run: |
          echo "refer to https://github.com/kunwardeep/paralleltest for detailed info" &&
          GO111MODULE=on go install github.com/kunwardeep/paralleltest@v1.0.10 &&
          paralleltest `go list ./... | grep -E -v "pkg/scheduler|pkg/controller/resource-recommend|pkg/util/resource-recommend|pkg/util/machine|pkg/agent/qrm-plugins/sriov/policy"`

  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          sudo env "PATH=$PATH" make test 2>&1 | go-junit-report -parser gotest -set-exit-code -iocopy -out report.xml
      - name: Verify tests ran
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("report.xml")
          executed = [case for case in report.iter("testcase") if case.find("skipped") is None]
          if not executed:
              raise SystemExit("No executed test cases found in report.xml")
          print(f"Executed test cases: {len(executed)}")
          PY
      - name: Test summary
        uses: test-summary/action@v2
        with:
          paths: report.xml
        if: always()
      - name: Check the number of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LINES_ADDED=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- pkg/ | awk '{ add += $1 } END { printf "%d", add }')
          echo "lines added: $LINES_ADDED"
          if [[ $LINES_ADDED -lt 10 ]]; then
            echo "NEED_TO_CHECK=false" >> "$GITHUB_ENV"
          else
            echo "NEED_TO_CHECK=true" >> "$GITHUB_ENV"
          fi
      - name: Upload coverage to Codecov
        if: ${{ (env.NEED_TO_CHECK == 'true') || (github.event_name != 'pull_request') }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          flags: unittest
          files: coverage.txt
          fail_ci_if_error: true
          verbose: true

  license:
    name: License
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check license header
        run: |
          make license && git add pkg cmd &&
          git diff --cached --exit-code || (echo 'Please run "make license" to add license headers' && exit 1);
