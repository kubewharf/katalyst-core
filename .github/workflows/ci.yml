      shell: bash
      run: 'cache_root=$(mktemp -d "$RUNNER_TEMP/ci-pair-cache.XXXXXX")

        printf ''GOPATH=%s/gopath\nGOMODCACHE=%s/modules\nGOCACHE=%s/build\nGOLANGCI_LINT_CACHE=%s/lint\n'' "$cache_root" "$cache_root" "$cache_root" "$cache_root" >> "$GITHUB_ENV"

        printf ''%s/gopath/bin\n'' "$cache_root" >> "$GITHUB_PATH"

        '
    - name: Check license header
      run: 'TIMEFORMAT=$''real %3R\nuser %3U\nsys %3S''

        time bash -e -o pipefail <<''CI_SCRIPT''

        make license && git add pkg cmd &&

        git diff --cached --exit-code || (echo ''Please run "make license" to add license headers'' && exit 1);

        CI_SCRIPT

        '
      shell: bash
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.repository == 'kubewharf/katalyst-core' && github.ref == 'refs/heads/test/ci-lifecycle-validation'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
        - internal
        - hosted
    env:
      PAIR_ROUND: '1'
      PAIR_RUNNER: ${{ matrix.runner }}
