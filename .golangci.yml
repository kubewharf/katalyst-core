version: "2"
run:
  concurrency: 16
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - pkg/client
      - vendor
      - test
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/kubewharf
  exclusions:
    generated: lax
    paths:
      - pkg/client
      - vendor
      - test
      - third_party$
      - builtin$
      - examples$
